<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한국사 × 한국뮤지컬 — 초등 한국사 수업 교사용 탐색 도구</title>
<meta name="description" content="2022 개정 사회과 한국사 성취기준에 연결한 한국 창작뮤지컬 자료. 역사 자료와 뮤지컬을 나란히 놓고 사실과 창작을 구분하며, 수업에 활용할 작품과 넘버를 찾습니다." />
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
/* ================================================================
   1. 디자인 토큰 — 라이트 테마
   배경은 따뜻한 회백색, 카드는 흰색, 골드는 포인트로만 제한한다.
================================================================ */
:root{
  /* KRDS 기본 */
  --color-primary:#006DD2; --color-primary-light:#E8F3FF;
  --color-white:#FFFFFF;

  /* 바탕·면 */
  --bg:#F7F7F5; --bg-soft:#FAF9F6; --surface:#FFFFFF; --surface-alt:#F4F5F7;

  /* 글자 */
  --ink:#1F2937;        /* 기본 본문 */
  --ink-soft:#5F6875;   /* 보조 본문 */
  --ink-mute:#667085;   /* 캡션 (이보다 흐린 회색은 쓰지 않는다) */

  /* 선 */
  --line:#E3E6EA; --line-soft:#EFF1F3;

  /* 무대 포인트 — 주요 추천·대표 넘버·작은 장식에만 */
  --gold:#B08A2E; --gold-ink:#7A5E13; --gold-bg:#FDF8EC; --gold-line:#EFE1C0;

  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --sp-xs:4px; --sp-sm:8px; --sp-md:16px; --sp-lg:24px; --sp-xl:40px;

  /* 시대색 기본값 (H04) */
  --e-bg:#ECEAF7; --e-ink:#4C46A0; --e-line:#DCD8F0;
}

/* ================================================================
   2. 기본 요소
================================================================ */
*{box-sizing:border-box;margin:0;padding:0;
  font-family:'Pretendard GOV','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
html{scroll-behavior:smooth;}
body{font-size:16px;line-height:1.65;color:var(--ink);background:var(--bg);
  min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{color:var(--color-primary);}
:focus-visible{outline:3px solid var(--color-primary);outline-offset:2px;border-radius:var(--r-sm);}
main{flex:1;width:100%;}
h1,h2,h3{letter-spacing:-.4px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:8px;font-weight:700;text-decoration:none;}
.skip:focus{left:8px;}
.wrap{max-width:1160px;margin:0 auto;padding:0 var(--sp-md);}

/* ================================================================
   3. 상단 네비게이션
================================================================ */
.nav{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--line);}
.nav-in{display:flex;align-items:center;flex-wrap:wrap;gap:10px var(--sp-md);max-width:1160px;
  margin:0 auto;width:100%;padding:10px var(--sp-md);}
.brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;letter-spacing:-.5px;
  color:var(--ink);white-space:nowrap;text-decoration:none;}
.brand .material-icons-outlined{font-size:22px;color:var(--gold);}
.nav-links{display:flex;gap:2px;margin-left:auto;}
.nav-links a{padding:8px 12px;border-radius:var(--r-md);font-size:15px;font-weight:600;
  color:var(--ink-soft);text-decoration:none;white-space:nowrap;transition:background .16s,color .16s;}
.nav-links a:hover{color:var(--ink);background:var(--surface-alt);}
.nav-links a[aria-current="page"]{color:var(--ink);background:var(--surface-alt);font-weight:700;}
/* 검색창 — 모바일에서는 한 줄을 통째로 쓰고, 데스크톱에서는 오른쪽에 붙는다 */
.nav-s{order:3;flex:1 1 100%;display:flex;align-items:center;gap:6px;background:var(--surface-alt);
  border:1px solid var(--line);border-radius:var(--r-md);padding:8px 12px;}
.nav-s:focus-within{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(0,109,210,.14);}
.nav-s .material-icons-outlined{font-size:20px;color:var(--ink-mute);}
.nav-s input{background:none;border:none;outline:none;color:var(--ink);font-size:15px;width:100%;}
.nav-s input::placeholder{color:var(--ink-mute);}

/* ================================================================
   4. 공통 — 버튼·배지·칩·섹션
================================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;
  border-radius:var(--r-md);font-size:15px;font-weight:700;text-decoration:none;transition:all .16s;}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:#111827;}
.btn-line{background:var(--surface);color:var(--ink);border:1px solid #CDD3DA;}
.btn-line:hover{border-color:var(--ink-soft);background:var(--surface-alt);}

.bdg{display:inline-flex;align-items:center;font-size:13px;font-weight:700;padding:3px 10px;
  border-radius:999px;white-space:nowrap;line-height:1.5;}
.bdg-era{background:var(--e-bg);color:var(--e-ink);}
.bdg-core{background:#EAF0F7;color:#1F4E79;}
.bdg-sub{background:var(--surface-alt);color:var(--ink-soft);}
.bdg-mode{background:#F1F3F5;color:#4B5563;}
.bdg-type{background:var(--gold-bg);color:var(--gold-ink);border:1px solid var(--gold-line);}

.sec{margin-top:var(--sp-xl);scroll-margin-top:84px;}
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:var(--sp-md);}
.sec-h{font-size:1.25rem;font-weight:800;}
.sec-d{font-size:14px;color:var(--ink-soft);}
.sec-more{margin-left:auto;font-size:14px;font-weight:700;color:var(--color-primary);
  text-decoration:none;white-space:nowrap;}
.sec-more:hover{text-decoration:underline;}

/* ================================================================
   5. 홈 — 서비스 소개
================================================================ */
.intro{background:linear-gradient(180deg,#FFFFFF 0%,var(--bg-soft) 100%);border-bottom:1px solid var(--line);}
.intro-in{max-width:1160px;margin:0 auto;padding:38px var(--sp-md) 34px;
  display:flex;flex-direction:column;gap:var(--sp-lg);}
.intro-t{font-size:clamp(1.55rem,4.6vw,2.05rem);font-weight:800;line-height:1.3;letter-spacing:-1px;}
.intro-p{margin-top:12px;font-size:16px;color:var(--ink-soft);line-height:1.7;max-width:560px;}
.intro-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
.intro-stat{margin-top:18px;font-size:14px;color:var(--ink-mute);}
.intro-stat b{color:var(--ink);font-weight:700;}
.intro-arts{display:flex;gap:12px;}
.intro-art{flex:1 1 0;max-width:150px;aspect-ratio:2/3;border-radius:var(--r-md);overflow:hidden;
  background:var(--surface-alt);border:1px solid var(--line);box-shadow:0 6px 18px rgba(31,41,55,.10);}
.intro-art img{width:100%;height:100%;object-fit:cover;display:block;}
.intro-art:nth-child(2){transform:translateY(-10px);}

/* ================================================================
   6. 홈 — 시대 카드
================================================================ */
.eras{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.era-c{display:block;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:16px 16px 15px;text-decoration:none;color:inherit;
  border-top:3px solid var(--e-ink);transition:box-shadow .16s,transform .16s;}
.era-c:hover{box-shadow:0 6px 18px rgba(31,41,55,.09);transform:translateY(-2px);}
.era-n{display:block;font-size:13px;font-weight:800;color:var(--e-ink);letter-spacing:.5px;}
.era-t{display:block;font-size:17px;font-weight:800;margin-top:2px;line-height:1.35;word-break:keep-all;}
.era-c-count{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;
  background:var(--e-bg);color:var(--e-ink);padding:2px 9px;border-radius:999px;}
.era-k{display:block;margin-top:8px;font-size:13.5px;color:var(--ink-soft);line-height:1.55;}

/* ================================================================
   7. 작품 카드
================================================================ */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 14px;}
.wcard{display:flex;flex-direction:column;text-decoration:none;color:inherit;}
.wcard-art{position:relative;width:100%;aspect-ratio:2/3;border-radius:var(--r-md);overflow:hidden;
  background:var(--e-bg);border:1px solid var(--line);box-shadow:0 2px 8px rgba(31,41,55,.07);
  transition:box-shadow .18s,transform .18s;}
.wcard:hover .wcard-art,.wcard:focus-visible .wcard-art{box-shadow:0 10px 22px rgba(31,41,55,.16);transform:translateY(-3px);}
.wcard-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;
  opacity:0;transition:opacity .3s;}
.wcard-img.on{opacity:1;}
/* 포스터 대체 — 밝은 시대색 타이포그래피 */
.wcard-fb{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
  padding:14px 13px;background:var(--e-bg);}
.wcard-fb-e{font-size:13px;font-weight:700;color:var(--e-ink);}
.wcard-fb-t{margin-top:8px;font-size:16px;font-weight:800;color:var(--ink);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
.wcard-fb-n{margin-top:auto;font-size:13px;color:var(--ink-mute);}
.wcard-art.has-img .wcard-fb{display:none;}
.wcard-type{position:absolute;top:8px;left:8px;z-index:3;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.94);color:var(--gold-ink);border:1px solid var(--gold-line);
  padding:2px 8px;border-radius:999px;}
.wcard-t{margin-top:10px;font-size:15px;font-weight:700;line-height:1.4;word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.wcard-m{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.wcard-m .bdg{font-size:13px;padding:2px 8px;}
.wcard-num{margin-top:6px;font-size:13px;color:var(--gold-ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ================================================================
   8. 작품 목록 — 필터
================================================================ */
.page{max-width:1160px;margin:0 auto;padding:var(--sp-lg) var(--sp-md) var(--sp-xl);}
.page-h{font-size:1.6rem;font-weight:800;}
.page-s{font-size:15px;color:var(--ink-soft);margin-top:6px;}
.filters{margin:var(--sp-lg) 0 var(--sp-md);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:14px var(--sp-md);display:flex;flex-direction:column;gap:12px;}
.fgroup{display:flex;align-items:flex-start;gap:10px;}
.fgroup-l{flex:0 0 74px;font-size:13.5px;font-weight:700;color:var(--ink-soft);padding-top:7px;}
.fchips{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
.chip{padding:6px 13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;
  font-size:14px;font-weight:600;color:var(--ink-soft);transition:all .14s;white-space:nowrap;}
.chip:hover{border-color:#C4CBD3;color:var(--ink);}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;}
.chip-era[aria-pressed="true"]{background:var(--e-ink);border-color:var(--e-ink);color:#fff;}
.count{font-size:15px;color:var(--ink-soft);margin-bottom:var(--sp-md);}
.count b{color:var(--ink);font-weight:800;}
.reset{font-size:14px;font-weight:700;color:var(--color-primary);text-decoration:underline;margin-left:8px;}
.empty{text-align:center;padding:var(--sp-xl) var(--sp-md);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);color:var(--ink-soft);font-size:15px;}
.empty .material-icons-outlined{font-size:40px;color:#C4CBD3;display:block;margin-bottom:10px;}

/* ================================================================
   9. 작품 상세
================================================================ */
.detail{max-width:820px;margin:0 auto;padding:var(--sp-md) var(--sp-md) var(--sp-xl);}
.back{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;
  color:var(--ink-soft);padding:6px 0;margin-bottom:10px;}
.back:hover{color:var(--ink);}
.back .material-icons-outlined{font-size:18px;}
.dhead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--sp-md);display:flex;flex-direction:column;gap:var(--sp-md);}
.dposter{width:172px;aspect-ratio:2/3;border-radius:var(--r-md);overflow:hidden;position:relative;
  background:var(--e-bg);border:1px solid var(--line);flex-shrink:0;}
.dposter img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;opacity:0;transition:opacity .3s;}
.dposter img.on{opacity:1;}
.dposter .wcard-fb{padding:16px 14px;}
.dposter.has-img .wcard-fb{display:none;}
.dtitle{font-size:clamp(1.5rem,4.4vw,1.9rem);font-weight:800;line-height:1.28;word-break:keep-all;}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.dlead{margin-top:14px;font-size:16.5px;line-height:1.65;color:var(--ink);font-weight:600;word-break:keep-all;}
.dpeople{margin-top:14px;padding-top:13px;border-top:1px solid var(--line-soft);font-size:15px;color:var(--ink-soft);}
.dpeople b{display:block;font-size:13.5px;color:var(--ink-mute);font-weight:700;margin-bottom:2px;}
.dbody{max-width:760px;margin:0 auto;}
.dsec{margin-top:30px;}
.dsec-h{font-size:1.06rem;font-weight:800;margin-bottom:9px;}
.dtext{font-size:16px;line-height:1.7;color:var(--ink-soft);word-break:keep-all;}
.dtext+.dtext{margin-top:8px;}

/* 역사와 작품의 관계 — 차분한 정보 카드 */
.rel{margin-top:26px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:16px 18px;}
.rel-l{font-size:13.5px;font-weight:700;color:var(--ink-mute);}
.rel-m{font-size:17px;font-weight:800;margin-top:3px;}
.rel-n{margin-top:7px;font-size:15px;line-height:1.65;color:var(--ink-soft);}

/* 대표 넘버 — 유일한 골드 강조 */
.numcard{background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:var(--r-lg);padding:16px 18px;}
.numcard-t{font-size:1.2rem;font-weight:800;color:var(--ink);line-height:1.4;}
.numcard-s{margin-top:4px;font-size:14.5px;color:var(--gold-ink);font-weight:600;}
.numcard-c{margin-top:9px;font-size:15px;line-height:1.65;color:var(--ink-soft);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.numnone{font-size:15px;color:var(--ink-mute);background:var(--surface-alt);
  border-radius:var(--r-md);padding:12px 16px;}

/* 수업 질문 */
.qbox{margin-top:14px;background:var(--surface-alt);border-radius:var(--r-lg);padding:15px 18px;}
.qbox-l{font-size:13.5px;font-weight:700;color:var(--ink-mute);}
.qbox-t{margin-top:5px;font-size:16.5px;font-weight:700;line-height:1.6;word-break:keep-all;}
.cnote{margin-top:14px;font-size:14.5px;line-height:1.65;color:var(--ink-soft);}
.cnote b{color:var(--ink);font-weight:700;}

/* 아코디언 */
.acc{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);}
.acc>summary{list-style:none;cursor:pointer;padding:13px 16px;font-size:15.5px;font-weight:700;
  display:flex;align-items:center;gap:8px;}
.acc>summary::-webkit-details-marker{display:none;}
.acc>summary::before{content:"▸";color:var(--ink-mute);font-size:13px;transition:transform .18s;}
.acc[open]>summary::before{transform:rotate(90deg);}
.acc-b{padding:0 16px 16px;border-top:1px solid var(--line-soft);padding-top:13px;}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
.tg{font-size:13.5px;padding:4px 11px;border-radius:999px;background:var(--surface-alt);
  color:var(--ink-soft);text-decoration:none;}
a.tg:hover{background:#E8EBEF;color:var(--ink);}
.stdcode{display:inline-block;font-size:13.5px;font-weight:700;background:var(--color-primary-light);
  color:#0B4C8C;padding:3px 10px;border-radius:999px;}
.srcs{display:flex;flex-wrap:wrap;gap:8px;}
.src{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;
  background:var(--surface-alt);color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:var(--r-md);}
.src:hover{background:#E8EBEF;}

/* ================================================================
   10. 이용 안내
================================================================ */
.guide{max-width:820px;}
.steps{display:flex;flex-direction:column;gap:10px;margin-top:var(--sp-md);}
.step{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:15px 16px;}
.step-n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;}
.step-t{font-size:16px;font-weight:700;}
.step-d{font-size:15px;color:var(--ink-soft);margin-top:3px;line-height:1.6;}
.notice{font-size:14px;color:var(--ink-soft);line-height:1.7;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-md);margin-top:var(--sp-lg);}
.loading{text-align:center;padding:var(--sp-xl);color:var(--ink-mute);}

/* ================================================================
   11. 푸터
================================================================ */
.chichiboo-footer{width:100%;padding:var(--sp-md) var(--sp-lg);background:var(--surface);
  border-top:1px solid var(--line);text-align:center;margin-top:auto;}
.chichiboo-footer a{display:inline-flex;align-items:center;gap:var(--sp-xs);font-size:13.5px;
  color:var(--ink-mute);text-decoration:none;transition:color .2s;}
.chichiboo-footer a:hover{color:var(--color-primary);}
.chichiboo-footer .material-icons-outlined{font-size:16px;}

/* ================================================================
   12. 반응형
================================================================ */
@media (min-width:600px){
  .pgrid{grid-template-columns:repeat(3,1fr);gap:22px 16px;}
  .eras{grid-template-columns:repeat(3,1fr);}
}
@media (min-width:768px){
  .nav-in{padding:12px var(--sp-lg);flex-wrap:nowrap;}
  .nav-s{order:0;flex:0 0 auto;}
  .nav-s input{width:190px;}
  .wrap,.page,.intro-in{padding-left:var(--sp-lg);padding-right:var(--sp-lg);}
  .detail{padding-left:var(--sp-lg);padding-right:var(--sp-lg);}
  .intro-in{flex-direction:row;align-items:center;justify-content:space-between;padding-top:44px;padding-bottom:44px;}
  .intro-box{flex:1 1 auto;max-width:600px;}
  .intro-arts{flex:0 0 auto;}
  .dhead{flex-direction:row;gap:var(--sp-lg);padding:var(--sp-lg);}
  .dhead-info{flex:1;min-width:0;}
}
@media (min-width:860px){
  .pgrid{grid-template-columns:repeat(4,1fr);}
  .eras{grid-template-columns:repeat(4,1fr);}
  .dposter{width:200px;}
}
@media (min-width:1024px){.pgrid{grid-template-columns:repeat(5,1fr);}}
@media (min-width:1240px){.pgrid{grid-template-columns:repeat(6,1fr);}}
@media (max-width:420px){
  .fgroup{flex-direction:column;gap:5px;}
  .fgroup-l{padding-top:0;}
}
</style>
</head>
<body>

<!-- 상단 네비게이션 -->
<nav class="nav">
  <div class="nav-in">
    <a class="brand" href="#/"><span class="material-icons-outlined">theater_comedy</span><span>한국사 × 한국뮤지컬</span></a>
    <div class="nav-links">

":"M35","title":"꼭두별초","number_title":"내일의 땅","singer":"Various Artists","status":"일부 확인","context":"국악방송 선곡표에서 《꼭두별초》 수록곡으로 확인.","history_connection":"삼별초와 민초의 대몽항쟁·삶을 다룬 작품 맥락에서 고려 사람들의 전쟁 경험과 미래에 대한 바람을 살펴보는 후보.","source_url":"https://www.igbf.kr/gugak_web/radio/radio_program_board.jsp?bIdx=129363&idx=RD2014001829&pageNo=49&state=view&sub_id=744&sub_num=0"},{"number_id":"RN025","work_id":"M37","title":"왕자대전","number_title":"신하된 자의 도리","singer":"충녕","status":"확인","context":"충녕이 신하와 왕자의 위치, 자신이 지켜야 할 도리에 대한 태도를 드러내는 솔로 넘버.","history_connection":"‘신하된 자의 도리’라는 표현을 통해 조선 왕실과 유교 사회의 군신 관계·역할 윤리를 살펴보고 실제 유교 질서와 비교.","source_url":"https://www.dimf.or.kr/portal/festival/view.do?idx=182&mId=0203020200&searchType=002"},{"number_id":"RN026","work_id":"M38","title":"이순신","number_title":"나를 태워라","singer":null,"status":"일부 확인","context":"《이순신》의 대표 넘버로 지정. 곡명은 확인되나 현재 확보한 공식 자료만으로 정확한 가창 배역과 극 중 장면을 확정하기 어려워 추가 검증이 필요함.","history_connection":"이순신의 결의와 전쟁 속 선택을 『난중일기』 등 실제 기록과 비교해, 영웅화된 무대 표현과 역사 기록의 관점을 구분한다.","source_url":"https://www.themusical.co.kr/Musical/Detail?num=1403"},{"number_id":"RN027","work_id":"M40","title":"대장금","number_title":"내가 가겠소","singer":null,"status":"일부 확인","context":"《대장금》의 대표 넘버로 지정. 정확한 극 중 위치와 가창 배역은 공식 곡목·영상 자료를 추가 확인할 필요가 있음.","history_connection":"장금의 선택과 행동이 궁중의 여성 직역·신분·교육 환경과 어떻게 맞물리는지 살펴보고, 드라마적 창작과 조선의 실제 생활사를 비교한다.","source_url":"https://www.themusical.co.kr/Musical/Detail?num=1601"},{"number_id":"RN028","work_id":"M41","title":"칠서","number_title":"일어선다","singer":"정원영·박영수·최정수·정지만·김용한·강상준·이기완·신상언","status":"확인","context":"서얼 차별과 시대의 신분 질서에 맞서는 칠서 인물들의 집단적 의지를 드러내는 넘버.","history_connection":"조선의 서얼 차별과 신분 질서가 사람들의 삶과 선택에 미친 영향을 살펴보고, 실제 역사적 맥락과 극적 재구성을 비교.","source_url":"https://ch.yes24.com/article/details/79756"},{"number_id":"RN029","work_id":"M44","title":"판","number_title":"새가 날아든다","singer":"달수·호태·사람들","status":"확인","context":"달수와 그를 전기수로 이끈 호태, 주변 사람들이 함께 부르며 풍자와 집단적 목소리를 확장하는 넘버.","history_connection":"19세기 세책가·전기수·독서문화라는 실제 생활문화와 작품의 <script>
/* ================================================================
   데이터 로드 — data/*.json. INLINE_DATA 가 있으면 단일 파일 모드.
   데이터 객체는 그대로 사용하고, 화면 표현만 아래에서 가공한다.
================================================================ */
const FILES=["h","works","relations","numbers","sources"];
let DB={};
async function loadData(){
  if(window.INLINE_DATA){DB=window.INLINE_DATA;return;}
  const res=await Promise.all(FILES.map(f=>fetch(`./data/${f}.json`).then(r=>{
    if(!r.ok)throw new Error(f);return r.json();})));
  FILES.forEach((f,i)=>DB[f]=res[i]);
}

/* ================================================================
   유틸
================================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
const splitDot=s=>String(s||"").split(/[·|]/).map(x=>x.trim()).filter(Boolean);
const sents=s=>(String(s||"").match(/[^.!?]+[.!?]*/g)||[]).map(x=>x.trim()).filter(Boolean);

/* 화면용 용어 정돈 — 2022 개정 초등 사회과 공식 용어 체계에 맞춘다.
   DB 원문은 바꾸지 않고, 출력 시점에만 문맥이 분명한 표현만 정돈한다. */
const TERMS=[[/식민지\s*통치/g,"일제의 식민 통치"],[/식민지\s*청년/g,"일제강점기 청년"],
  [/식민지\s*도시/g,"일제강점기 도시"],[/식민지\s*시대/g,"일제 통치 시기"],
  [/식민지\s*시기/g,"일제 통치 시기"]];
const ui=s=>{
  let t=String(s==null?"":s);
  TERMS.forEach(p=>{t=t.replace(p[0],p[1]);});
  /* 내부 식별자(H01~H07)가 문장에 남아 있으면 시대명으로 바꿔 읽히게 한다 */
  return t.replace(/H0[1-7]/g,m=>{const h=(DB.h||[]).find(x=>x.h_id===m);return h?h.era_short:m;});
};
const et=s=>esc(ui(s));   /* 화면 출력 기본 함수 */

/* ================================================================
   시대색 — 밝은 파스텔 배경 + 선명한 포인트색 (칩·아이콘·포인트에만 사용)
================================================================ */
const ERA={

const HM=()=>Object.fromEntries(DB.h.map(h=>[h.h_id,h]));

const relationsOf=id=>DB.relations.filter(r=>r.work_id===id);
const numTitleOf=w=>w.representative_number||((numberOf(w.work_id)||{}).number_title)||null;
const worksOfH=hid=>[...new Set(DB.relations.filter(r=>r.h_id===hid).map(r=>r.work_id))]

/* 콘텐츠 유형 배지 — 뮤지컬은 기본값이므로 숨기고 예외만 표시 */
const TYPE_LABEL={M33:"2022 쇼케이스"};
const typeBadge=w=>TYPE_LABEL[w.work_id]||((w.content_type&&w.content_type!=="뮤지컬")?w.content_type:"");

const STRENGTH_HINT={"핵심":"해당 성취기준과 직접 연결하기 좋은 작품",
                     "보조":"일부 장면이나 주제를 선별해 활용하기 좋은 작품"};

/* 시대별 학습 키워드 — 관계 데이터의 연결 근거에서 상위 항목만 뽑아 쓴다 */
function eraKeywords(hid){
  const c={};
  DB.relations.filter(r=>r.h_id===hid).forEach(r=>arr(r.relation_basis).forEach(b=>{c[b]=(c[b]||0)+1;}));
  return Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,4).join(" · ");
}

/* 주의점 — 편집용 선정 사유는 걸러 내고, 수업에서 실제로 확인할 문장만 남긴다 */
const CUE=/구분|선별|오인|밝힐|균형|보완|주의|유의|조심|허구|가상|창작 인물|창작·|창작이|창작 설정|창작극|재구성임|압축|폭력|잔혹|동일시|볼 것|할 것|말 것|분명히/;
const SKIP=/H0\d|적합|좋음|직접성|보조작|핵심작|보조로|조정/;
const nrm=s=>String(s||"").toLowerCase().replace(/[\s·,.'"()《》〈〉:!?]/g,"");
function bigrams(s){const o=new Set();for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2));return o;}
function sim(a,b){
  if(!a||!b)return 0;
  const A=bigrams(a),B=bigrams(b);let n=0;A.forEach(x=>{if(B.has(x))n++;});
  return n/(A.size+B.size-n);
}
function cautionText(w){
  const ff=nrm(w.fact_fiction_note);
  return sents(w.caution).filter(s=>CUE.test(s)&&!SKIP.test(s)&&sim(nrm(s),ff)<.45).join(" ");
}

let S={q:"",h:"",strength:"",mode:"",use:"",num:""},route={name:"home",id:null};

function parseHash(){
  const raw=location.hash.replace(/^#/,"")||"/";
  const [path,query]=raw.split("?");
  const p=new URLSearchParams(query||"");
  S={q:p.get("q")||"",h:p.get("h")||"",strength:p.get("s")||"",mode:p.get("m")||"",
     use:p.get("use")||"",num:p.get("num")||""};
  const m=path.match(/^\/works?\/([A-Za-z0-9_]+)$/);
  if(m)route={name:"work",id:m[1]};
  else if(path.indexOf("/works")===0)route={name:"works",id:null};
  else if(path.indexOf("/guide")===0)route={name:"guide",id:null};
  else route={name:"home",id:null};
}
function qstr(){
  const p=new URLSearchParams();
  if(S.q)p.set("q",S.q); if(S.h)p.set("h",S.h);
  if(S.strength)p.set("s",S.strength); if(S.mode)p.set("m",S.mode);
  if(S.use)p.set("use",S.use); if(S.num)p.set("num",S.num);
  const s=p.toString();return s?"?"+s:"";
}
const goWorks=()=>{location.hash="#/works"+qstr();};
const hasFilter=()=>!!(S.q||S.h||S.strength||S.mode||S.use||S.num);

/* ================================================================
   검색 — 작품명·인물·넘버에 가중치를 둔다
================================================================ */
function score(w,q){
  const t=nrm(q);if(!t)return 1;
  const F=[[nrm(w.title),5],[nrm(w.tags),4],[nrm(w.characters),4],[nrm(numTitleOf(w)),4],
    [nrm(w.era_label)+nrm(arr(w.h_topics).join(""))+nrm(arr(w.h_ids).join("")),3],
    [nrm(w.synopsis),2],[nrm(arr(w.relation_basis).join(""))+nrm(w.curriculum_connection),2],
    [nrm(w.lesson_activity)+nrm(w.lesson_question),1],[nrm(w.search_text),1]];
  let s=0;
  F.forEach(f=>{const hay=f[0],wt=f[1];
    if(hay){if(hay===t)s+=wt*3;else if(hay.indexOf(t)>=0)s+=wt;}});
  return s;
}
function filtered(){
  let l=DB.works.slice();
  if(S.h)l=l.filter(w=>arr(w.h_ids).indexOf(S.h)>=0);
  if(S.strength)l=l.filter(w=>w.relation_strength===S.strength);
  if(S.mode)l=l.filter(w=>w.history_link_mode===S.mode);
  if(S.use)l=l.filter(w=>(w.elementary_use||"").indexOf("바로")===0);
  if(S.num)l=l.filter(w=>!!numTitleOf(w));
  if(S.q)l=l.map(w=>[w,score(w,S.q)]).filter(x=>x[1]>0)
            .sort((a,b)=>b[1]-a[1]||(a[0].sort_order||0)-(b[0].sort_order||0)).map(x=>x[0]);
  else l.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  return l;
}

}

/* 시대 균형을 고려해 목록에서 골라 담는다 */
function pickBalanced(list,n,exclude){
  const ex=exclude||[],byEra={},out=[];
  DB.h.forEach(h=>byEra[h.h_id]=[]);
  list.forEach(w=>{if(ex.indexOf(w.work_id)<0&&byEra[w.primary_h])byEra[w.primary_h].push(w);});
  for(let round=0;out.length<n;round++){
    let added=false;
    for(const h of DB.h){const q=byEra[h.h_id];
      if(q[round]){out.push(q[round]);added=true;if(out.length>=n)break;}}
    if(!added)break;
  }
  return out;
}

              srcLink(nsrc,"대표 넘버 출처"),
              srcLink(w.poster_source_url,"포스터 출처"+(w.poster_source?" ("+et(w.poster_source)+")":""))
             ].filter(Boolean).join("");
  const details=`<div class="dsec">
    ${acc("작품 줄거리와 인물",[
      w.synopsis?`<p class="dtext">${et(w.synopsis)}</p>`:"",
      w.characters?`<p class="dtext" style="margin-top:9px"><strong>주요 인물</strong> · ${et(splitDot(w.characters).join(" · "))}</p>`:"",
      tags.length?`<div class="tags">${tags.map(t=>
        `<a class="tg" href="#/works?q=${encodeURIComponent(t)}">${et(t)}</a>`).join("")}</div>`:""
    ].join(""))}
    ${acc("2022 개정 사회과 연결",[
      w.standard_code?`<p><span class="stdcode">2022 개정 사회 ${esc(w.standard_code)}</span></p>`:"",
      std.standard_text?`<p class="dtext" style="margin-top:9px">${et(std.standard_text)}</p>`:"",
      w.curriculum_connection?`<p class="dtext" style="margin-top:11px">${et(w.curriculum_connection)}</p>`:"",
      (arr(w.h_topics).length||arr(w.relation_basis).length)?`<div class="tags">
        ${arr(w.h_topics).map(t=>`<span class="tg">${et(t)}</span>`).join("")}
        ${arr(w.relation_basis).map(t=>`<span class="tg">${et(t)}</span>`).join("")}</div>`:"",
      otherH.length?`<p class="dtext" style="margin-top:11px">이 작품은 다른 시대에도 연결됩니다.</p>
        <div class="tags">${otherH.map(r=>
          `<a class="tg" href="#/works?h=${esc(r.h_id)}">${et((hm[r.h_id]||{}).era_label||r.h_id)}</a>`).join("")}</div>`:""
    ].join(""))}
    ${acc("대표 넘버 자세히",numTitle&&(nctx||nhist)?[
      nctx?`<p class="dtext">${et(nctx)}</p>`:"",
      nhist?`<p class="dtext" style="margin-top:8px">${et(nhist)}</p>`:""
    ].join(""):"")}
    ${acc("수업 활용 시 참고",[
      w.elementary_use?`<p class="dtext"><strong>초등 활용</strong> · ${et(w.elementary_use)}</p>`:"",
      w.caution&&!caution?`<p class="dtext" style="margin-top:8px">${et(w.caution)}</p>`:""
    ].join(""))}
    ${acc("출처",srcs?`<div class="srcs">${srcs}</div>`:"")}
  </div>`;

  return `<div class="detail">
    <button class="back" data-back><span class="material-icons-outlined" aria-hidden="true">arrow_back</span>작품 목록으로</button>
    ${head}
    <div class="dbody">${rel}${why}${num}${lesson}${details}</div>
  </div>`;
}

/* ================================================================
   렌더 · 이벤트
================================================================ */
const app=()=>$("#app");
function render(){
  parseHash();
  const v=route.name;
  app().innerHTML = v==="work"?viewWork(route.id) : v==="works"?viewWorks()
                  : v==="guide"?viewGuide() : viewHome();
  app().dataset.view=v;
  window.scrollTo({top:0,behavior:"instant"});
  document.querySelectorAll(".nav-links a").forEach(a=>{
    const on=(a.dataset.nav==="home"&&v==="home")||(a.dataset.nav==="works"&&(v==="works"||v==="work"))
           ||(a.dataset.nav==="guide"&&v==="guide");
    on?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current");});
  const w=v==="work"?WM()[route.id]:null;
  document.title=(w?w.title+" — ":"")+"한국사 × 한국뮤지컬";
  const qi=$("#q");if(qi&&document.activeElement!==qi)qi.value=S.q;
  bind();
}
function bind(){
  document.querySelectorAll("[data-h]").forEach(b=>b.addEventListener("click",()=>{S.h=b.dataset.h;goWorks();}));
  document.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>{S.strength=b.dataset.s;goWorks();}));
  document.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",()=>{S.mode=b.dataset.m;goWorks();}));
  document.querySelectorAll("[data-use]").forEach(b=>b.addEventListener("click",()=>{S.use="";goWorks();}));
  document.querySelectorAll("[data-num]").forEach(b=>b.addEventListener("click",()=>{S.num="";goWorks();}));
  const rs=$("#reset");
  if(rs)rs.addEventListener("click",()=>{location.hash="#/works";});
  const sc=document.querySelector("[data-scroll]");
  if(sc)sc.addEventListener("click",()=>{const t=$("#"+sc.dataset.scroll);
    if(t)t.scrollIntoView({behavior:"smooth",block:"start"});});
  const bk=document.querySelector("[data-back]");
  if(bk)bk.addEventListener("click",()=>{
    if(history.length>1)history.back();else location.hash="#/works";});
  /* 아코디언 — 여는 상태를 보조기기에 함께 알린다 */
  document.querySelectorAll("details.acc").forEach(d=>{
    const s=d.querySelector("summary");
    s.setAttribute("aria-expanded",d.open?"true":"false");
    d.addEventListener("toggle",()=>s.setAttribute("aria-expanded",d.open?"true":"false"));});
}
let qTimer=null;
$("#q").addEventListener("input",e=>{
  clearTimeout(qTimer);const v=e.target.value.trim();
  /* 상단 검색은 전역 검색이므로 남아 있던 필터를 함께 비운다 */
  qTimer=setTimeout(()=>{S={q:v,h:"",strength:"",mode:"",use:"",num:""};goWorks();},280);});
window.addEventListener("hashchange",render);

loadData().then(render).catch(err=>{
  app().innerHTML=`<div class="page"><div class="empty">
    <span class="material-icons-outlined" aria-hidden="true">cloud_off</span>자료 파일을 불러오지 못했습니다.
    <p style="margin-top:10px;font-size:14.5px">이 파일은 <code>data/</code> 폴더의 JSON을 함께 읽습니다.
    폴더째 웹 서버로 실행하거나(<code>python3 -m http.server</code>) 단일 파일 버전을 사용해 주세요.</p></div></div>`;
  console.error(err);});
</script>
